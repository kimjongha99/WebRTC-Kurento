<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="/style.css?v=1.1" type="text/css" media="screen">
    <script src="/js/conferenceroom.js?v=1.1"></script>
    <script src="/js/participant.js?v=1.1"></script>
    <script src="/js/kurento-utils.js?v=1.1"></script>
</head>
<body>
<div id="container">
    <div id="wrapper">
        <div id="join" class="animate join">
            <h1>Join a Room</h1>
            <form onsubmit="register(); return false;" accept-charset="UTF-8">
                <p>
                    <input type="text" id="userId" placeholder="사용자 ID"> <!-- 타입을 text로 변경 -->
                </p>
                <p>
                    <input type="text" id="roomId" placeholder="방 ID"> <!-- 타입을 text로 변경 -->
                </p>
                <p class="submit">
                    <input type="submit" name="commit" value="Join!">
                </p>
            </form>
        </div>
        <div id="room" style="display: none;">
            <h2 id="room-header"></h2>
            <div id="participants"></div>
            <input type="button" id="button-leave" onmouseup="leaveRoom();" value="Leave room">

            <div id="screen-share-container"></div>  <!-- 추가 -->
            <input type="button" id="button-share" onclick="startScreenShare();" value="Share Screen">
            <input type="button" id="button-stop-share" onclick="stopScreenShare();" value="Stop Share" style="display: none;">
        </div>
    </div>
</div>
</body>
</html>
